name: Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mock:
    name: Build and publish mock image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/xdei-group/aerialclaw:mock
            ghcr.io/xdei-group/aerialclaw:mock-${{ github.sha }}
          cache-from: type=gha,scope=aerialclaw-mock
          cache-to: type=gha,mode=max,scope=aerialclaw-mock

  gazebo:
    name: Build and publish Gazebo image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gazebo
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/xdei-group/aerialclaw:gazebo
            ghcr.io/xdei-group/aerialclaw:gazebo-${{ github.sha }}
          cache-from: type=gha,scope=aerialclaw-gazebo
          cache-to: type=gha,mode=max,scope=aerialclaw-gazebo
